# DataKit Manager Web 版 —— Kubernetes 部署示例
#
# 1. 先导入镜像：把 datakit-manager-web-<版本>-linux-<架构>.tar 推送到你的仓库，
#    或在节点上执行  ctr -n k8s.io images import <tar>
# 2. 修改下面的 image 和密码
# 3. kubectl apply -f datakit-manager-web.yaml
# 4. kubectl -n datakit-manager port-forward svc/datakit-manager 8080:80  后访问 http://127.0.0.1:8080
#
# 这个服务保存着各集群的 kubeconfig，等同于集群管理员权限：
# 不要直接暴露到公网，对外提供访问时请放在带 HTTPS 的 Ingress / 网关后面。
apiVersion: v1
kind: Namespace
metadata:
  name: datakit-manager
---
apiVersion: v1
kind: Secret
metadata:
  name: datakit-manager-auth
  namespace: datakit-manager
type: Opaque
stringData:
  username: admin
  password: CHANGE-ME          # 必须修改
  secret-key: CHANGE-ME-TOO    # 必须修改：凭据（kubeconfig / SSH 私钥）加密密钥的来源，设定后不要再改
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datakit-manager-data
  namespace: datakit-manager
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # storageClassName: <你的 StorageClass>   # 没有存储插件时，见下方 volumes 里的 hostPath 写法
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datakit-manager
  namespace: datakit-manager
  labels:
    app: datakit-manager
spec:
  replicas: 1                  # 数据保存在本地文件，只能单副本
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: datakit-manager
  template:
    metadata:
      labels:
        app: datakit-manager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: datakit-manager
          image: datakit-manager:1.4.0      # 改成你仓库里的镜像地址
          imagePullPolicy: IfNotPresent
          env:
            - name: DKM_USERNAME
              valueFrom:
                secretKeyRef: {name: datakit-manager-auth, key: username}
            - name: DKM_PASSWORD
              valueFrom:
                secretKeyRef: {name: datakit-manager-auth, key: password}
            - name: DKM_SECRET_KEY       # 加密密钥不落在数据卷里
              valueFrom:
                secretKeyRef: {name: datakit-manager-auth, key: secret-key}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: datakit-manager-data
          # 没有存储插件时，删掉上面两行和 PVC，改用固定节点上的目录（目录属主需为 65532）：
          # hostPath: {path: /var/lib/datakit-manager, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: datakit-manager
  namespace: datakit-manager
spec:
  selector:
    app: datakit-manager
  ports:
    - name: http
      port: 80
      targetPort: http
